# Creates the labels the membership flow uses. Runs whenever this file changes,
# or by hand from the Actions tab.
name: Set up labels

on:
  push:
    branches: [main]
    paths: [.github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'new member', color: 'ffc93c', description: 'Sign-up from the pledge form' },
              { name: 'approved',   color: '00802f', description: 'Founder approval: adds the member to the website' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
                core.info(`Created "${l.name}"`);
              } catch (e) {
                if (e.status !== 422) throw e;
                await github.rest.issues.updateLabel({ ...context.repo, ...l });
                core.info(`Updated "${l.name}"`);
              }
            }
