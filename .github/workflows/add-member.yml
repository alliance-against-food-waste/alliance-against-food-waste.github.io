# Adds a new member to members.json when a founding member labels their
# "New member" issue `approved`. Only people with triage access or above can
# add labels, so the label itself is the approval.
name: Add approved member

on:
  issues:
    types: [labeled]

permissions:
  contents: write   # commit members.json
  issues: write     # comment, remove label, close
  pages: write      # request a Pages rebuild

# One at a time, so two approvals in quick succession cannot overwrite each
# other's members.json.
concurrency:
  group: members
  cancel-in-progress: false

jobs:
  add:
    if: github.event.label.name == 'approved' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const addMember = require('./.github/scripts/add-member.js');
            await addMember({ github, context, core });
